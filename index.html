            <!-- 큰 트랙 (초기 + 둘러 보기 단계) -->
            <g id="p1f1Track" style="transition: opacity 0.6s">
              <rect x="${trackX}" y="${trackY}" width="${W}" height="${H}" rx="${R}" fill="url(#grass)" stroke="#C8E6C9" stroke-width="2"/>
              <text x="${vbW/2}" y="${trackY + H/2 + 12}" text-anchor="middle" font-size="36" fill="#5D4037">운동장 트랙</text>
              <rect x="${trackX}" y="${trackY}" width="${W}" height="${H}" rx="${R}" fill="none" stroke="#FFB3C7" stroke-width="3" stroke-dasharray="8,6"/>
              <rect id="p1f1Tape" x="${trackX}" y="${trackY}" width="${W}" height="${H}" rx="${R}" fill="none"
                    stroke="#FF477E" stroke-width="8" stroke-linecap="round"
                    pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"
                    style="transition: stroke-dashoffset 2.6s ease-in-out"/>
            </g>
            <!-- 측정 단계: 자만 표시 -->
            <g id="p1f1Measure" style="opacity:0; transition:opacity 0.6s">
              <text x="${vbW/2}" y="${ropeY - 60}" text-anchor="middle" font-size="26" fill="#5D4037">끈을 곧게 펼쳐서 자로 재면…</text>
              <line id="p1f1Rope" x1="${ropeX}" y1="${ropeY}" x2="${ropeX + rulerW}" y2="${ropeY}" stroke="#FF477E" stroke-width="9" stroke-linecap="round"
                    pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"
                    style="transition: stroke-dashoffset 1.2s ease-out 0.3s"/>
              <rect x="${ropeX}" y="${rulerY}" width="${rulerW}" height="${rulerH}" fill="#FFFCF0" stroke="#5D4037" stroke-width="2" rx="3"/>
              ${tickSvg}
              <text x="${ropeX + rulerW + 18}" y="${rulerY + rulerH + 26}" font-size="22" fill="#5D4037">m</text>
              <text x="${vbW/2}" y="${rulerY + rulerH + 90}" text-anchor="middle" fill="#7048E8" font-weight="800">
                <tspan font-size="32">트랙 둘레</tspan>
                <tspan font-size="32" dx="8">=</tspan>
                <tspan font-size="56" dx="10" fill="#FF477E">100 m</tspan>
              </text>
            </g>
          </svg>
          <button id="p1f1R" style="position:absolute; top:10px; right:12px; padding:4px 10px; font-size:13px; background:#FFF6E0; color:#7048E8; border:2px solid #C2B0F0; border-radius:8px; font-family:Jua; cursor:pointer">↻ 다시 하기</button>
        </div>
        <div class="controls-row">
          <button class="check-btn" id="p1f1Go" style="background:#FF477E; color:white; box-shadow:0 3px 0 #C2375F">끈으로 한 바퀴 둘러 보기</button>
        </div>
      </div>
      `;
    },
    init: () => {
      const tape = document.getElementById('p1f1Tape');
      const go = document.getElementById('p1f1Go');
      const rs = document.getElementById('p1f1R');
      const track = document.getElementById('p1f1Track');
      const measure = document.getElementById('p1f1Measure');
      const rope = document.getElementById('p1f1Rope');
      let stage = 0; // 0: 초기, 1: 둘렀음, 2: 측정
      function reset() {
        stage = 0;
        tape.style.transition = 'none';
        tape.setAttribute('stroke-dashoffset', '100');
        track.style.opacity = '1';
        measure.style.opacity = '0';
        rope.style.transition = 'none';
        rope.setAttribute('stroke-dashoffset', '100');
        go.textContent = '끈으로 한 바퀴 둘러 보기';
        go.disabled = false;
        go.style.display = '';
        requestAnimationFrame(() => {
          tape.style.transition = 'stroke-dashoffset 2.6s ease-in-out';
          rope.style.transition = 'stroke-dashoffset 1.2s ease-out 0.3s';
        });
      }
      go.onclick = () => {
        if (stage === 0) {
          stage = 1;
          tape.setAttribute('stroke-dashoffset', '0');
          go.disabled = true;
          setTimeout(() => {
            burstConfetti(380, 230);
            addStars(state.studentName, 1);
            go.textContent = '끈을 펼쳐서 자로 재 보기 ▶';
            go.disabled = false;
          }, 2700);
        } else if (stage === 1) {
          stage = 2;
          // 트랙을 숨기고 자만 보이게
          track.style.opacity = '0';
          measure.style.opacity = '1';
          rope.setAttribute('stroke-dashoffset', '0');
          go.style.display = 'none';
          setTimeout(() => { burstConfetti(380, 320); addStars(state.studentName, 1); }, 1500);
        }
      };
      rs.onclick = reset;
    }
  }
]);
// 문제 상황은 운동장 트랙(F1) 한 페이지만 — 그 다음은 바로 개념 학습으로 갑니다.

/* — 이전에 있던 옛 F2/F3 (정사각형 색종이 활동 / 둘레 정의) —
   학생들이 '문제 상황'에서 정사각형으로 측정 활동을 먼저 하면 개념 학습의 정다각형 흐름과 어긋나서 제거됨.
   필요하면 개념 학습 F1(정다각형) 안에서 정사각형 선택 시 자동으로 같은 흐름이 됩니다.

  { // [removed] F2: 끈 드래그로 둘레 두르기 (라이브 라인) — 정사각형 색종이
    html: () => `
      ${hintBar('📏', '<b>끈을 잡고 다음 꼭짓점까지 끌어</b> 정사각형 색종이의 둘레를 한 바퀴 둘러 봐요!')}
      <div class="stage-area" style="position:relative">
        <svg id="p1f2" viewBox="0 0 700 380" width="700" height="380"></svg>
        <button id="p1f2R" style="position:absolute; top:10px; right:12px; padding:4px 10px; font-size:13px; background:#FFF6E0; color:#7048E8; border:2px solid #C2B0F0; border-radius:8px; font-family:Jua; cursor:pointer">↻ 다시 하기</button>
      </div>
      <div id="p1f2Expr" style="text-align:center; font-family:Jua; font-size:34px; color:#229954; font-weight:800; min-height:44px; padding: 4px">끈으로 한 변씩 따라가 봐요!</div>
    `,
    init: () => {
      const svg = document.getElementById('p1f2');
      // 정사각형 꼭짓점 (시계방향) — 한 변 5 cm
      const corners = [[240,80],[460,80],[460,300],[240,300]];
      const lengths = [5, 5, 5, 5];
      const N = 4;
      let cur = 0;
      function tapeColor(i) { return ['#FF477E','#FFB300','#2FB344','#7048E8'][i % 4]; }
      function updateExpr() {
        const expr = document.getElementById('p1f2Expr');
        if (cur === 0) {
          expr.textContent = '끈으로 한 변씩 따라가 봐요!';
        } else if (cur < N) {
          expr.textContent = lengths.slice(0, cur).join(' + ') + ' cm';
        } else {
          const sum = lengths.reduce((s,x)=>s+x,0);
          expr.innerHTML = `${lengths.join(' + ')} = <span style="color:#7048E8">${sum}</span> cm`;
        }
      }
      function draw() {
        let g = `<rect x="240" y="80" width="220" height="220" fill="#FFE9B3" stroke="#E69A1F" stroke-width="3" stroke-dasharray="6,4"/>`;
        // 꼭짓점 (조금 작게)
        corners.forEach((c, i) => {
          const visited = i <= cur;
          g += `<circle cx="${c[0]}" cy="${c[1]}" r="${visited?9:13}" fill="${visited?'#2FB344':'#FFC940'}" stroke="white" stroke-width="2.5"/>`;
        });
        // 이미 완료된 변 (테이프 두께도 가늘게)
        for (let i = 0; i < cur; i++) {
          const a = corners[i], b = corners[(i+1) % N];
          const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
          g += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${tapeColor(i)}" stroke-width="9" stroke-linecap="round"/>`;
          // 각 변의 위치에 맞게 라벨 바깥쪽으로
          const offX = (i===1 ? 44 : (i===3 ? -44 : 0));
          const offY = (i===0) ? -22 : (i===2 ? 38 : 8);
          g += `<text x="${mx + offX}" y="${my + offY}" text-anchor="middle" font-size="34" fill="${tapeColor(i)}" font-weight="800">${lengths[i]}cm</text>`;
        }
        if (cur < N) {
          const next = corners[(cur+1) % N];
          g += `<circle cx="${next[0]}" cy="${next[1]}" r="18" fill="none" stroke="#E64C82" stroke-width="3" stroke-dasharray="5,3"><animate attributeName="r" from="14" to="22" dur="0.8s" repeatCount="indefinite"/></circle>`;
          // 라이브 라인 (드래그 중에 그릴 선)
          const here = corners[cur];
          g += `<line id="liveTape" x1="${here[0]}" y1="${here[1]}" x2="${here[0]}" y2="${here[1]}" stroke="${tapeColor(cur)}" stroke-width="9" stroke-linecap="round" opacity="0.85" pointer-events="none"/>`;
          // 드래그 헤드

  { // F1: 정다각형 — 끈으로 한 변씩 끌어서 측정 (왼쪽 식 · 오른쪽 도형)

          },
          onSnap: () => {
            cur++;
            if (cur === N) { burstConfetti(360, 200); addStars(state.studentName, 1); }
            upd(); draw();
          },
          onEnd: (didSnap) => {
            if (!didSnap && live) { live.setAttribute('x2', here[0]); live.setAttribute('y2', here[1]); }
          }
        });
      }
      function upd() {
        function buildAdd(num, count) {
          if (count <= 0) return '';
          let html = String(num);
          for (let i = 1; i < count; i++) html += ` <span style="white-space:nowrap">+&nbsp;${num}</span>`;
          return html;
        }
        if (cur === 0) {
          addBox.textContent = '—';
        } else if (cur < N) {
          addBox.innerHTML = `<span style="display:inline-block; line-height:1.4">${buildAdd(side, cur)} <span style="white-space:nowrap; opacity:0.4">cm</span></span>`;
        } else {
          addBox.innerHTML = `<span style="display:inline-block; line-height:1.4"><b>${buildAdd(side, N)}</b> <span style="white-space:nowrap"><b>=&nbsp;${side*4}&nbsp;cm</b></span></span>`;
        }
        if (cur === N) {
          mulBox.style.opacity = '0.35';
          mulBox.innerHTML = '<span style="color:#888">곱셈식으로 정리하면…</span>';
          setTimeout(() => {
            if (cur !== N) return;
            mulBox.style.opacity = '1';
            mulBox.innerHTML = `<span style="white-space:nowrap"><b>${side} × 4 = ${side*4} cm</b></span>`;
          }, 900);
        } else {
          mulBox.style.opacity = '0.35';
          mulBox.innerHTML = '<span style="color:#888">곱셈식으로 정리하면…</span>';
        }
      }
      draw(); upd();
    }
  },
  { // F8: 마름모 공식 찾기 — 도형을 눌러 식 확인
    html: () => `
      ${hintBar('🔎', '여러 마름모를 눌러 <b>둘레 공식</b>을 찾아봐요. 네 변이 모두 같은 게 마름모예요!')}

        <svg id="p2f8Svg" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid meet" style="width:100%; max-height:420px; flex:1; min-height:0"></svg>
        <div id="p2f8Formula" style="background:linear-gradient(135deg,#FFD6E3,#FFB3C7); border:3px solid #E64C82; border-radius:16px; padding:12px 18px; text-align:center; font-size:28px; color:#2A2540; box-shadow:0 4px 0 #C2375F; white-space:nowrap; overflow:hidden; opacity:0; transition: opacity 0.5s">
          마름모의 둘레 = <span style="color:#E64C82"><b>한 변</b></span> × <span style="color:#E64C82"><b>4</b></span>
        </div>
      </div>
    `,
    init: () => {
      // 3-4-5 비율 또는 적당한 비율의 마름모들
      const samples = [
        { side: 5, halfDx: 4, halfDy: 3, color: '#E64C82', fill: '#FFD6E3' },
        { side: 4, halfDx: 3, halfDy: 2.65, color: '#E69A1F', fill: '#FFE9B3' },
        { side: 6, halfDx: 5, halfDy: 3.32, color: '#1971C2', fill: '#C7E4FF' }
      ];
      const cell = 18;
      const vbW = 800;
      const cellW = vbW / samples.length;
      const clicked = new Set();
      const svg = document.getElementById('p2f8Svg');
      const formula = document.getElementById('p2f8Formula');
      function draw() {
        let g = '';
        samples.forEach((s, k) => {
          const dx = s.halfDx*cell, dy = s.halfDy*cell;
          const cx = cellW*(k + 0.5);
          const cy = 150;
          const pts = [
            [cx, cy - dy],
            [cx + dx, cy],
            [cx, cy + dy],
            [cx - dx, cy]
          ];
          const open = clicked.has(k);
          g += `<g class="rhomCard" data-k="${k}" style="cursor:pointer">
            <polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${s.fill}" stroke="${s.color}" stroke-width="${open?5:3}"/>
            <text x="${cx + dx/2 + 8}" y="${cy - dy/2 + 8}" font-size="20" fill="${s.color}">${s.side} cm</text>
            ${open
              ? `<text x="${cx}" y="${cy + dy + 44}" text-anchor="middle" font-size="26" fill="#7048E8" font-weight="800">${s.side} × 4 = ${s.side*4} cm</text>`
              : `<text x="${cx}" y="${cy + dy + 44}" text-anchor="middle" font-size="22" fill="#888">눌러서 식 보기</text>`}
          </g>`;
        });
        svg.innerHTML = g;
        svg.querySelectorAll('.rhomCard').forEach(el => {
          el.onclick = () => { clicked.add(+el.dataset.k); draw(); checkAll(); };
        });
      }
      function checkAll() {
        if (clicked.size === samples.length) {
          formula.style.opacity = '1';
          burstConfetti(400, 380);
        }
      }
      draw();
    }
  }
]);

      ${hintBar('📐', '넓이의 기본 단위! 한 변이 <b>1 cm</b>인 정사각형의 넓이 = <b>1 cm²</b>')}
      <div class="stage-area" style="display:flex; gap:18px; padding:18px; align-items:center">
        <!-- 왼쪽: 단위 넓이 도형 -->
        <div style="flex: 0 0 42%; display:flex; align-items:center; justify-content:center">
          <svg viewBox="0 0 280 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="max-height:360px">
            <rect x="60" y="60" width="160" height="160" fill="#C7E4FF" stroke="#2196F3" stroke-width="5"/>
            <text x="140" y="46" text-anchor="middle" font-size="26" fill="#5D4037">1 cm</text>
            <text x="48" y="148" text-anchor="end" font-size="26" fill="#5D4037">1 cm</text>
            <text x="140" y="152" text-anchor="middle" font-size="44" fill="#1971C2"><tspan font-weight="800">1 cm²</tspan></text>
          </svg>
        </div>
        <!-- 오른쪽: 설명 (글씨 1.5배) -->
        <div style="flex: 1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:18px; padding: 0 14px">
          <div style="font-size:32px; color:#2A2540; line-height:1.5">
            가로 1 cm, 세로 1 cm 정사각형의 넓이는 <span style="color:#7048E8"><b>1 cm²</b></span>예요.
          </div>
          <div style="font-size:32px; color:#2A2540; line-height:1.5">
            이것을 <span style="color:#E64C82"><b>단위 넓이</b></span>라고 해요.
          </div>
          <div style="font-size:32px; color:#2A2540; line-height:1.5">
            단위 넓이가 <span style="color:#E64C82"><b>몇 개</b></span>인지 세어 넓이를 알 수 있어요.
          </div>
        </div>
      </div>
    `
  },
  { // F2: 1cm² 타일을 끌어다 채우기
    html: () => `
      ${hintBar('🧱', '오른쪽의 <b style="color:#E64C82">파란 타일</b>을 끌어다 <b style="color:#E64C82">직사각형</b> 안에 놓아 넓이를 직접 채워 봐요.')}
      <div class="stage-area" style="position:relative">
        <svg id="r2f2" viewBox="0 0 760 440" width="760" height="440" preserveAspectRatio="xMidYMid meet" style="max-height:100%"></svg>
        <!-- 완료 팝업 — 도형이 가리지 않도록 하단 배치 -->
        <div id="r2f2Popup" style="position:absolute; left:50%; bottom:10px; transform:translate(-50%, 30px); background:linear-gradient(135deg,#E5DAFF,#C5B3FF); border:4px solid #7048E8; border-radius:18px; padding:14px 22px; box-shadow:0 10px 30px rgba(80,40,200,0.35); text-align:center; font-size:24px; color:#2A2540; opacity:0; pointer-events:none; transition: opacity 0.4s, transform 0.4s; z-index: 50; white-space:nowrap">
          <b>🎉 타일 12개 → 1 cm²가 12개이면 넓이는 <span style="color:#E64C82">12 cm²</span></b>
        </div>
      </div>
      <input type="hidden" id="r2f2N">
    `,
    init: () => {
      const cols = 4, rows = 3;
      const cell = 80;
      const W = cols*cell, H = rows*cell;
      const gx = 60, gy = 80;
      const svg = document.getElementById('r2f2');
      // 각 슬롯에 타일이 놓였는지
      let placed = new Array(cols*rows).fill(false);
      let tileCounter = 0;
      function nextEmpty() {
        for (let i = 0; i < placed.length; i++) if (!placed[i]) return i;
        return -1;
      }
      function slotPos(idx) {
        const i = idx % cols, j = Math.floor(idx / cols);
        return [gx + i*cell, gy + j*cell];
      }
      function draw() {
        let g = '';
        // 격자 슬롯 (빈 칸)
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
          const id = j*cols+i;
          if (!placed[id]) g += `<rect x="${gx+i*cell}" y="${gy+j*cell}" width="${cell}" height="${cell}" fill="white" stroke="#D8C9A3" stroke-width="1.5" stroke-dasharray="4,3"/>`;
        }
        // 직사각형 테두리
        g += `<rect x="${gx}" y="${gy}" width="${W}" height="${H}" fill="none" stroke="#FF477E" stroke-width="5"/>`;
        g += `<text x="${gx+W/2}" y="${gy-16}" text-anchor="middle" font-size="24" fill="#E64C82">가로 4 cm</text>`;
        g += `<text x="${gx-14}" y="${gy+H/2+8}" text-anchor="end" font-size="24" fill="#E64C82">세로 3 cm</text>`;
        // 이미 놓인 타일 (직각 모서리)
        placed.forEach((on, id) => {
          if (on) {
            const [px, py] = slotPos(id);
            g += `<g pointer-events="none">
              <rect x="${px+2}" y="${py+2}" width="${cell-4}" height="${cell-4}" fill="#B3E0FF" stroke="#1971C2" stroke-width="2"/>
              <text x="${px+cell/2}" y="${py+cell/2+8}" text-anchor="middle" font-size="22" fill="#1971C2">${on}</text>
            </g>`;
          }
        });
        // 타일 공급 영역 (오른쪽)
        const supX = 480, supY = 100;
        g += `<rect x="${supX-10}" y="${supY-30}" width="180" height="260" rx="14" fill="#FFFCF0" stroke="#FFB840" stroke-width="2" stroke-dasharray="6,4"/>`;
        g += `<text x="${supX+80}" y="${supY-10}" text-anchor="middle" font-size="20" fill="#E69A1F">타일 더미</text>`;
        const empty = nextEmpty();
        if (empty >= 0) {
          const [tx, ty] = slotPos(empty);
          const sx = supX + 50, sy = supY + 80;
          const initTx = sx - tx;
          const initTy = sy - ty;
          g += `<g id="r2tile" transform="translate(${initTx},${initTy})">
            <rect x="${tx+2}" y="${ty+2}" width="${cell-4}" height="${cell-4}" fill="#4DABF7" stroke="#1971C2" stroke-width="3"/>
            <text x="${tx+cell/2}" y="${ty+cell/2+8}" text-anchor="middle" font-size="22" fill="white">1cm²</text>
          </g>`;
          g += `<rect x="${tx+2}" y="${ty+2}" width="${cell-4}" height="${cell-4}" fill="none" stroke="#1971C2" stroke-width="2" stroke-dasharray="4,3" pointer-events="none"/>`;
        }
        svg.innerHTML = g;
        const tile = document.getElementById('r2tile');
        if (!tile) return;
        makeDraggable(svg, tile, {
          snap: { x: 0, y: 0, distance: 35 },
          onSnap: () => {
            tileCounter++;
            placed[empty] = tileCounter;
            document.getElementById('r2f2N').textContent = tileCounter;
            if (tileCounter === cols*rows) {
              burstConfetti(540, 340);
              // 도형은 그대로 유지, 팝업이 하단에서 떠 오름
              const popup = document.getElementById('r2f2Popup');
              if (popup) { popup.style.opacity = '1'; popup.style.transform = 'translate(-50%, 0)'; }
              addStars(state.studentName, 1);
            }
            draw();
          }
        });
      }
      draw();
    }
  },
  { // F3: 모눈종이 위에 직접 직사각형을 그려 보기 → 식을 쓰고 공식 팝업
    html: () => `
      ${hintBar('⚡', '<b>모눈종이</b> 위에 칸을 끌어 직접 직사각형을 그려 보아요.')}
      <div class="stage-area" style="position:relative; padding: 20px">
        <svg id="r2f3" viewBox="0 0 760 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="max-height:100%"></svg>
        <!-- 공식 팝업 -->
        <div id="r2f3Pop" style="position:absolute; left:50%; bottom:14px; transform: translate(-50%, 20px); background:linear-gradient(135deg,#E5DAFF,#C5B3FF); border:4px solid #7048E8; border-radius:18px; padding:12px 18px; box-shadow:0 10px 30px rgba(80,40,200,0.35); text-align:center; font-size:24px; color:#2A2540; opacity:0; pointer-events:none; transition: opacity 0.4s, transform 0.4s; z-index: 50; white-space:nowrap; max-width:96%">
          <b>넓이 = <span style="color:#E64C82">가로</span> × <span style="color:#E64C82">세로</span></b>
        </div>
      </div>
      <!-- 도형 아래쪽: 학생이 식을 직접 적음 — 연습하기와 같은 양식 -->
      <div class="practice-rows" style="padding: 4px 8px 0">
        <div class="pr-row" style="justify-content:center">
          <label class="pr-lab" style="width:auto">식</label>
          <input class="pr-num" id="r2f3W" type="number" placeholder="가로">
          <span class="pr-op">×</span>
          <input class="pr-num" id="r2f3H" type="number" placeholder="세로">
          <span class="pr-op">=</span>
          <input class="pr-num" id="r2f3R" type="number" placeholder="넓이">
          <span style="font-size:22px; color:#5D4037; margin-left:4px">cm²</span>
          <button class="check-btn" id="r2f3Chk" style="margin-left:10px">확인하기</button>
          <button id="r2f3R2" style="margin-left:8px; padding:6px 12px; font-size:14px; background:#FFF6E0; color:#7048E8; border:2px solid #C2B0F0; border-radius:8px; font-family:Jua; cursor:pointer">↻ 다시 하기</button>
        </div>
        <div id="r2f3Fb" class="feedback" style="text-align:center; margin: 0 auto"></div>
      </div>
    `,
    init: () => {
      // 그리드 좌우·상하 여백을 동일하게: 12×6 칸 → 6:3 비율 (2:1)
      // viewBox 760×400 안에서 가운데 정렬, 위·아래 모두 50씩 여백 (라벨 공간 확보)
      const MAX_W = 12, MAX_H = 6;
      const cell = 44;
      const gw = MAX_W * cell;   // 528
      const gh = MAX_H * cell;   // 264
      const gx = (760 - gw) / 2; // 116 — 좌우 116씩
      const gy = (400 - gh) / 2; // 68  — 위·아래 68씩
      let w = 0, h = 0;
      let dragging = false;
      const svg = document.getElementById('r2f3');
      const pop = document.getElementById('r2f3Pop');
      const fb = document.getElementById('r2f3Fb');
      const wInp = document.getElementById('r2f3W');
      const hInp = document.getElementById('r2f3H');
      const rInp = document.getElementById('r2f3R');
      function draw() {
        let g = '';
        for (let i = 0; i < MAX_W; i++) for (let j = 0; j < MAX_H; j++) {
          const inside = (i < w && j < h);
          const cx = gx + i*cell, cy = gy + j*cell;
          g += `<rect class="r2f3Cell" data-i="${i}" data-j="${j}" x="${cx}" y="${cy}" width="${cell}" height="${cell}" fill="${inside ? '#C7E4FF' : '#FFFCF0'}" stroke="#D8C9A3" stroke-width="1" style="cursor:pointer"/>`;
        }
        if (w > 0 && h > 0) {
          g += `<rect x="${gx}" y="${gy}" width="${w*cell}" height="${h*cell}" fill="none" stroke="#1971C2" stroke-width="5" pointer-events="none"/>`;
          g += `<text x="${gx + w*cell/2}" y="${gy - 18}" text-anchor="middle" font-size="22" fill="#1971C2"><tspan font-weight="800">가로 ${w} cm</tspan></text>`;
          g += `<text x="${gx - 14}" y="${gy + h*cell/2 + 8}" text-anchor="end" font-size="22" fill="#1971C2"><tspan font-weight="800">세로 ${h} cm</tspan></text>`;
        } else {
          g += `<text x="${gx + gw/2}" y="${gy + gh/2 + 8}" text-anchor="middle" font-size="22" fill="#888">칸을 끌어 직사각형을 그려 보세요</text>`;
        }
        svg.innerHTML = g;
        svg.querySelectorAll('.r2f3Cell').forEach(el => {
          el.onpointerdown = e => {
            dragging = true;
            const i = +el.dataset.i, j = +el.dataset.j;
            w = i + 1; h = j + 1;
            draw();
            e.preventDefault();
          };
          el.onpointerenter = () => {
            if (!dragging) return;
            const i = +el.dataset.i, j = +el.dataset.j;
            w = i + 1; h = j + 1;
            draw();
          };
        });
      }
      // 드래그 종료를 확실히: window 와 svg 양쪽 모두에 등록
      const stopDrag = () => { dragging = false; };
      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);
      svg.addEventListener('pointerleave', stopDrag);
      document.getElementById('r2f3Chk').onclick = () => {
        if (w === 0 || h === 0) {
          fb.className = 'feedback wrong show';
          fb.textContent = '먼저 모눈종이 위에 직사각형을 그려 보세요.';
          return;
        }
        const wi = +wInp.value, hi = +hInp.value, ri = +rInp.value;
        if (wi === w && hi === h && ri === w*h) {
          // 초록색 정답 박스 대신 공식 팝업만 띄움
          fb.className = 'feedback';
          fb.textContent = '';
          pop.innerHTML = `<b>넓이 = <span style="color:#E64C82">가로</span> × <span style="color:#E64C82">세로</span> = ${w} × ${h} = <span style="color:#7048E8">${w*h} cm²</span></b>`;
          pop.style.opacity = '1';
          pop.style.transform = 'translate(-50%, 0)';
          burstConfetti(380, 200);
          addStars(state.studentName, 1);
        } else {
          fb.className = 'feedback wrong show';
          fb.textContent = '식과 답을 다시 확인해 봐요.';
        }
      };
      // 다시 하기: 그림과 입력을 모두 초기화
      document.getElementById('r2f3R2').onclick = () => {
        w = 0; h = 0;
        wInp.value = ''; hInp.value = ''; rInp.value = '';
        fb.className = 'feedback';
        fb.textContent = '';
        pop.style.opacity = '0';
        pop.style.transform = 'translate(-50%, 20px)';
        draw();
      };
      draw();
    }
  },
  { // F4: 한 변이 100배 길어지면 넓이는?
    html: () => `
      ${hintBar('🌍', '<b style="color:#E64C82">한 변</b>의 길이가 <b style="color:#E64C82">100배</b> 길어지면 넓이는 얼마나 차이날까요?')}
      <div class="stage-area" style="display:flex; gap:24px; padding:18px; align-items:center">
        <!-- 왼쪽: 1 m² 정사각형 (글씨 크게) -->
        <div style="flex:0 0 32%; display:flex; align-items:center; justify-content:center; height:100%">
          <svg viewBox="0 0 420 460" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="max-height:100%">
            <g transform="translate(50,90)">
              <rect width="320" height="320" fill="#FFE9B3" stroke="#FF8C42" stroke-width="4"/>
              <g stroke="#FFD08F" stroke-width="0.8">
                ${(() => { let s=''; for(let i=1;i<10;i++) s += `<line x1="${i*32}" y1="0" x2="${i*32}" y2="320"/><line x1="0" y1="${i*32}" x2="320" y2="${i*32}"/>`; return s; })()}
              </g>
              <rect width="32" height="32" fill="#4DABF7" stroke="#1971C2" stroke-width="2"/>
              <text x="16" y="22" text-anchor="middle" font-size="14" fill="#1971C2" font-weight="800">1cm²</text>
              <text x="160" y="-24" text-anchor="middle" font-size="48" fill="#5D4037" font-weight="800">1 m = 100 cm</text>
              <text x="-22" y="170" text-anchor="end" font-size="48" fill="#5D4037" font-weight="800">1 m</text>
            </g>
          </svg>
        </div>
        <!-- 오른쪽: 단계별 정리 (HTML로 크게 표시) -->
        <div style="flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:18px; font-family:Jua; line-height:1.15">
          <div style="font-size: clamp(36px, 5.6vw, 96px); color:#FF477E; font-weight:800; white-space:nowrap">1 cm × 1 cm = 1 cm²</div>
          <div style="font-size: clamp(36px, 5.6vw, 96px); color:#7048E8; font-weight:800; white-space:nowrap">1 m = 100 cm</div>
          <div style="font-size: clamp(30px, 4.6vw, 80px); color:#FF477E; font-weight:800; white-space:nowrap">100 cm × 100 cm = 10000 cm²</div>
          <div style="font-size: clamp(36px, 5.6vw, 96px); color:#7048E8; font-weight:800; white-space:nowrap">1 m × 1 m = 1 m²</div>
          <div style="font-size: clamp(34px, 5.2vw, 88px); color:#2A2540; font-weight:800; white-space:nowrap">→ 1 m² = 10,000 cm²</div>
        </div>
      </div>
    `
  }
]);

defFrames('para', 'concept', [
  { // F1: 단계별 밑변·높이 안내 (한 페이지 안에서 양옆 화살표로 단계 이동)
    html: () => `
      ${hintBar('📐', '평행사변형의 <b>밑변</b>과 <b>높이</b>를 한 단계씩 함께 알아봐요.')}

      const steps = [
        {
          msg: '<div>평행사변형은 직사각형과 달라요.</div><div>가장자리에 <span style="color:#E64C82"><b>직각이 아닌 부분</b></span>이 있어요.</div>',
          draw: () => {
            let g = gridG(gx, gy, 16, 9, cell);
            g += `<polygon points="${BL.join(',')} ${BR.join(',')} ${TR.join(',')} ${TL.join(',')}" fill="rgba(81,207,102,0.4)" stroke="#2FB344" stroke-width="4"/>`;
            g += `<line x1="${BL[0]}" y1="${BL[1]}" x2="${TL[0]}" y2="${TL[1]}" stroke="#E64C82" stroke-width="6"/>`;
            g += `<line x1="${BR[0]}" y1="${BR[1]}" x2="${TR[0]}" y2="${TR[1]}" stroke="#E64C82" stroke-width="6"/>`;
            return g;
          }
        },
        {
          msg: '<div>그래서 가로, 세로라는 말 대신</div><div>평행사변형에서는 <span style="color:#FF477E"><b>밑변</b></span>이라는 말을 써요.</div>',
          draw: () => {
            let g = gridG(gx, gy, 16, 9, cell);
            g += `<polygon points="${BL.join(',')} ${BR.join(',')} ${TR.join(',')} ${TL.join(',')}" fill="rgba(81,207,102,0.4)" stroke="#2FB344" stroke-width="4"/>`;
            g += `<line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="#FF477E" stroke-width="10"/>`;
            g += `<text x="${(BL[0]+BR[0])/2}" y="${BL[1]+44}" text-anchor="middle" font-size="40" fill="#FF477E"><tspan font-weight="800">밑변</tspan></text>`;
            return g;
          }
        },
        {
          msg: '<div><span style="color:#FF477E"><b>밑변</b></span>과 수직으로 만나고,</div><div>두 <span style="color:#FF477E"><b>밑변</b></span> 사이의 거리가 <span style="color:#7048E8"><b>높이</b></span>예요.</div>',
          draw: () => {
            let g = gridG(gx, gy, 16, 9, cell);
            g += `<polygon points="${BL.join(',')} ${BR.join(',')} ${TR.join(',')} ${TL.join(',')}" fill="rgba(81,207,102,0.4)" stroke="#2FB344" stroke-width="4"/>`;
            // 두 밑변 모두 분홍색으로 강조 (위쪽 밑변과 아래쪽 밑변)
            g += `<line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="#FF477E" stroke-width="10"/>`;
            g += `<line x1="${TL[0]}" y1="${TL[1]}" x2="${TR[0]}" y2="${TR[1]}" stroke="#FF477E" stroke-width="10"/>`;
            g += `<text x="${(BL[0]+BR[0])/2}" y="${BL[1]+44}" text-anchor="middle" font-size="36" fill="#FF477E"><tspan font-weight="800">밑변</tspan></text>`;
            g += `<text x="${(TL[0]+TR[0])/2}" y="${TL[1]-16}" text-anchor="middle" font-size="36" fill="#FF477E"><tspan font-weight="800">밑변</tspan></text>`;
            // 높이: 두 밑변 사이의 수직 거리
            const hx = TL[0];
            g += `<line x1="${hx}" y1="${TL[1]}" x2="${hx}" y2="${BL[1]}" stroke="#7048E8" stroke-width="8" stroke-dasharray="10,6"/>`;
            // 직각 표시 (밑변과 수직임을 보여 줌)
            g += `<rect x="${hx-16}" y="${BL[1]-16}" width="16" height="16" fill="none" stroke="#7048E8" stroke-width="3"/>`;
            g += `<rect x="${hx}" y="${TL[1]}" width="16" height="16" fill="none" stroke="#7048E8" stroke-width="3"/>`;
            g += `<text x="${hx+22}" y="${(TL[1]+BL[1])/2+12}" font-size="36" fill="#7048E8"><tspan font-weight="800">높이</tspan></text>`;
            return g;
          }
        }
      ];
      let s = 0;
      function show() {
        svg.innerHTML = steps[s].draw();
        msg.innerHTML = steps[s].msg;

        document.getElementById('p3f1Next').disabled = (s === steps.length - 1);
      }
      document.getElementById('p3f1Prev').onclick = () => { if (s>0) { s--; show(); } };
      document.getElementById('p3f1Next').onclick = () => { if (s<steps.length-1) { s++; show(); } };
      show();
    }
  },
  { // F2: (구 F2+F3+F4 통합) 빨간 삼각형을 잘라 오른쪽으로 옮겨 직사각형 만들기

      ${hintBar('✂️', '왼쪽 <b>분홍 삼각형</b>을 잘라 오른쪽의 점선 자리로 옮기면 직사각형이 돼요.')}

        <div id="p3f2Done" style="position:absolute; left:50%; bottom:20px; transform: translate(-50%, 30px); opacity:0; pointer-events:none; transition: opacity 0.4s, transform 0.4s; background:linear-gradient(135deg,#FFE5BA,#FFD08F); border:4px solid #E69A1F; border-radius:18px; padding:16px 26px; text-align:center; font-size:26px; color:#2A2540; box-shadow:0 10px 30px rgba(200,140,30,0.4); z-index: 50; max-width: 92%; line-height:1.5">
          <div style="white-space:nowrap">✨ 직사각형이 만들어졌어요.</div>
          <div><span style="white-space:nowrap">평행사변형의 <b style="color:#FF477E">밑변</b>이 직사각형의 <b style="color:#FF477E">가로</b>,</span> <span style="white-space:nowrap"><b style="color:#7048E8">높이</b>가 직사각형의 <b style="color:#7048E8">세로</b>가 돼요.</span></div>
          <div style="white-space:nowrap; color:#5D4037">그래서 <b>평행사변형의 넓이 = 밑변 × 높이</b></div>
        </div>
      </div>
    `,
    init: () => {
      const svg = document.getElementById('p3f2');
      const cell = 32, gx = 70, gy = 50;
      // 앞 페이지와 같은 모양: BL/BR/TL/TR
      const BL = [gx+1*cell, gy+8*cell], BR = [gx+10*cell, gy+8*cell];
      const TR = [gx+12*cell, gy+2*cell], TL = [gx+3*cell, gy+2*cell];
      const foot = [TL[0], BL[1]];     // 자른 후 직각 발
      const baseLen = BR[0] - BL[0];   // 옮길 거리
      let g = gridG(gx, gy, 18, 9, cell);
      // 오른쪽 목표 자리 (점선)
      g += `<polygon points="${BR[0]},${BR[1]} ${BR[0]+(TL[0]-BL[0])},${BR[1]} ${BR[0]+(TL[0]-BL[0])},${TR[1]}" fill="rgba(81,207,102,0.15)" stroke="#2FB344" stroke-width="3" stroke-dasharray="6,4"/>`;
      g += `<text x="${BR[0]+15}" y="${(BR[1]+TR[1])/2+5}" font-size="16" fill="#2FB344">여기로</text>`;
      // 남는 사다리꼴 (고정)
      g += `<polygon points="${foot.join(',')} ${BR.join(',')} ${TR.join(',')} ${TL.join(',')}" fill="rgba(199,228,255,0.5)" stroke="#1971C2" stroke-width="4"/>`;
      // 자르는 선 안내
      g += `<line x1="${foot[0]}" y1="${foot[1]}" x2="${TL[0]}" y2="${TL[1]}" stroke="#E64C82" stroke-width="3" stroke-dasharray="6,4" pointer-events="none"/>`;
      // 드래그 가능한 분홍 삼각형
      g += `<g id="p3DragT" style="cursor:grab"><polygon points="${BL.join(',')} ${foot.join(',')} ${TL.join(',')}" fill="rgba(255,107,157,0.75)" stroke="#FF477E" stroke-width="4"/></g>`;
      svg.innerHTML = g;
      const tri = document.getElementById('p3DragT');
      makeDraggable(svg, tri, {
        snap: { x: baseLen, y: 0, distance: 32 },
        onSnap: () => {
          const done = document.getElementById('p3f2Done');
          done.style.opacity = '1';
          done.style.transform = 'translate(-50%, 0)';
          const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          overlay.setAttribute('points', `${foot[0]},${foot[1]} ${foot[0]+baseLen},${foot[1]} ${foot[0]+baseLen},${TL[1]} ${TL[0]},${TL[1]}`);
          overlay.setAttribute('fill', 'rgba(255,201,64,0.25)');
          overlay.setAttribute('stroke', '#FFB840');
          overlay.setAttribute('stroke-width', '5');
          overlay.setAttribute('pointer-events', 'none');
          svg.appendChild(overlay);
          burstConfetti(540, 360);
          addStars(state.studentName, 2);
        }
      });
    }
  },
  { // F3: 공식 확인 — 도형 위 / 식+공식 아래 (통일 양식, grid 사용해서 식 항상 보이게)
    html: () => `
      ${hintBar('💡', '평행사변형의 <b>밑변</b>과 <b>높이</b>로 식을 직접 적어 보아요.')}

        <div style="display:flex; align-items:center; justify-content:center; gap:8px; padding: 4px 12px; flex-wrap:wrap">

          <input class="pr-num p3f3-inp" id="p3f3R" type="number" placeholder="넓이">
          <span style="font-size:20px; color:#5D4037">cm²</span>
          <button class="check-btn" id="p3f3Chk" style="margin-left:4px; font-size:18px; padding:8px 16px">확인</button>
        </div>
        <style>.p3f3-inp { width:84px !important; height:40px !important; font-size:20px !important; text-align:center; }</style>
        <div id="p3f3Pop" style="background:linear-gradient(135deg,#E5DAFF,#C5B3FF); border:3px solid #7048E8; border-radius:12px; padding:8px 14px; box-shadow:0 3px 0 #5532B8; text-align:center; font-size:20px; color:#2A2540; opacity:0; transition: opacity 0.4s; white-space:nowrap; overflow:hidden">
          <b>평행사변형 넓이 = <span style="color:#FF477E">밑변</span> × <span style="color:#7048E8">높이</span></b>
          <span id="p3f3PopExpr" style="color:#7048E8"></span>
        </div>
        <div id="p3f3Fb" class="feedback" style="text-align:center; margin: 0 auto; min-height:0"></div>
      </div>
    `,
    init: () => {
      const svg = document.getElementById('p3f3');
      const pop = document.getElementById('p3f3Pop');
      const fb = document.getElementById('p3f3Fb');
      const b = 9, h = 6;
      const cell = 38, gx = 100, gy = 30;
      let g = gridG(gx, gy, 14, 8, cell);
      const x0 = gx + 1*cell, y0 = gy + 7*cell;
      const x1 = x0 + b*cell, y1 = y0;
      const x2 = x1 + cell, y2 = y0 - h*cell;
      const x3 = x0 + cell, y3 = y2;
      g += `<polygon points="${x0},${y0} ${x1},${y1} ${x2},${y2} ${x3},${y3}" fill="rgba(81,207,102,0.4)" stroke="#2FB344" stroke-width="5"/>`;
      g += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#FF477E" stroke-width="8"/>`;
      g += `<line x1="${x3}" y1="${y3}" x2="${x3}" y2="${y0}" stroke="#7048E8" stroke-width="5" stroke-dasharray="10,6"/>`;
      g += `<rect x="${x3-16}" y="${y0-16}" width="16" height="16" fill="none" stroke="#7048E8" stroke-width="3"/>`;
      g += `<text x="${(x0+x1)/2}" y="${y0+44}" text-anchor="middle" font-size="36" fill="#FF477E"><tspan font-weight="800">밑변 ${b} cm</tspan></text>`;
      g += `<text x="${x3+18}" y="${(y3+y0)/2+10}" font-size="36" fill="#7048E8"><tspan font-weight="800">높이 ${h} cm</tspan></text>`;
      svg.innerHTML = g;
      document.getElementById('p3f3Chk').onclick = () => {
        const bi = +document.getElementById('p3f3B').value;
        const hi = +document.getElementById('p3f3H').value;
        const ri = +document.getElementById('p3f3R').value;
        if (bi === b && hi === h && ri === b*h) {
          fb.className = 'feedback';
          fb.textContent = '';
          pop.style.opacity = '1';
          document.getElementById('p3f3PopExpr').innerHTML = ` = ${b} × ${h} = <b>${b*h} cm²</b>`;
          burstConfetti(380, 200);
          addStars(state.studentName, 1);
        } else {
          fb.className = 'feedback wrong show';
          fb.textContent = '식과 답을 다시 확인해 봐요.';
        }
      };
    }
  }
]);

            g += `<rect x="${fx-16}" y="${B[1]-16}" width="16" height="16" fill="none" stroke="#7048E8" stroke-width="3"/>`;

  { // F2: 두 삼각형 — 마우스로 직접 이동·회전

        ✨ 평행사변형이 만들어졌어요. 똑같은 삼각형 2개로 만든 평행사변형이니까,<br>

      // 도형 정의 (로컬 좌표)
      const A = [180, 100], B = [80, 280], C = [320, 280];
      const cx = (A[0]+B[0]+C[0])/3, cy = (A[1]+B[1]+C[1])/3;
      // 시작 위치: 오른쪽으로 떨어뜨려 표시
      const initTx = 360, initTy = 0;
      // 목표: 180° 회전 후 평행이동 → 고정 삼각형과 변 AC를 공유하는 평행사변형 완성
      const tgtTx = (A[0]+C[0]) - 2*cx;
      const tgtTy = (A[1]+C[1]) - 2*cy;

      function render() {
        let g = '';
        // 점선 목표 자리
        const tA = [2*cx - A[0] + tgtTx, 2*cy - A[1] + tgtTy];
        const tB = [2*cx - B[0] + tgtTx, 2*cy - B[1] + tgtTy];
        const tC = [2*cx - C[0] + tgtTx, 2*cy - C[1] + tgtTy];
        g += `<polygon points="${tA.join(',')} ${tB.join(',')} ${tC.join(',')}" fill="rgba(255,201,64,0.12)" stroke="#E69A1F" stroke-width="2" stroke-dasharray="6,4"/>`;
        g += `<text x="${(tA[0]+tB[0]+tC[0])/3}" y="${(tA[1]+tB[1]+tC[1])/3+6}" text-anchor="middle" font-size="18" fill="#E69A1F">여기로</text>`;
        // 고정 삼각형 (왼쪽)
        g += `<polygon points="${A.join(',')} ${B.join(',')} ${C.join(',')}" fill="rgba(255,201,64,0.55)" stroke="#E69A1F" stroke-width="4"/>`;
        // 움직이는 삼각형 (이동·회전 가능)
        g += `<g id="t4mov">
          <polygon points="${A.join(',')} ${B.join(',')} ${C.join(',')}" fill="rgba(255,201,64,0.85)" stroke="#E69A1F" stroke-width="4"/>
          <circle cx="${A[0]}" cy="${A[1]}" r="6" fill="#E64C82" stroke="white" stroke-width="2"/>
          <g class="moveHandle">
            <circle cx="${cx}" cy="${cy}" r="22" fill="white" stroke="#7048E8" stroke-width="3"/>
            <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="26" fill="#7048E8" font-weight="800">✥</text>
          </g>
          <g class="rotateHandle">
            <line x1="${cx}" y1="${cy-22}" x2="${cx}" y2="${cy-100}" stroke="#E64C82" stroke-width="2" stroke-dasharray="4,3"/>
            <circle cx="${cx}" cy="${cy-120}" r="22" fill="white" stroke="#E64C82" stroke-width="3"/>
            <text x="${cx}" y="${cy-111}" text-anchor="middle" font-size="26" fill="#E64C82" font-weight="800">↻</text>
          </g>
        </g>`;
        svg.innerHTML = g;
        const movEl = document.getElementById('t4mov');
        makeMoveRotatable(svg, movEl, {
          cx, cy, tx: initTx, ty: initTy, rot: 0,
          snap: { tx: tgtTx, ty: tgtTy, rot: 180, dDist: 70, dRot: 35 },
          onSnap: () => {
            const handles = movEl.querySelectorAll('.moveHandle, .rotateHandle');
            handles.forEach(h => h.style.display = 'none');
            // 평행사변형 라벨
            const lblY = B[1] + 30;
            const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            lbl.innerHTML = `
              <line x1="${B[0]}" y1="${B[1]+12}" x2="${C[0]}" y2="${C[1]+12}" stroke="#FF477E" stroke-width="3"/>
              <text x="${(B[0]+C[0])/2}" y="${lblY+10}" text-anchor="middle" font-size="22" fill="#FF477E" font-weight="800">밑변</text>
              <line x1="${A[0]}" y1="${A[1]}" x2="${A[0]}" y2="${B[1]}" stroke="#7048E8" stroke-width="3" stroke-dasharray="6,4"/>
              <text x="${A[0]+12}" y="${(A[1]+B[1])/2+8}" font-size="22" fill="#7048E8" font-weight="800">높이</text>
            `;
            svg.appendChild(lbl);
            setTimeout(() => {
              document.getElementById('t4f2Done').classList.remove('hidden');
              burstConfetti(540, 360);
              addStars(state.studentName, 2);
            }, 200);
          }
        });
      }
      function reset() {
        document.getElementById('t4f2Done').classList.add('hidden');
        render();
      }
      document.getElementById('t4f2Reset').onclick = reset;
      render();
    }
  },
  { // F3: 공식 확인 — 도형 위 / 식+공식 아래 (grid 통일 양식)
    html: () => `
      ${hintBar('💡', '삼각형의 <b>밑변</b>과 <b>높이</b>로 식을 직접 적어 보아요.')}
      <div style="display:grid; grid-template-rows: 1fr auto auto auto; gap:8px; flex:1 1 auto; min-height:0; padding: 4px 8px">

        <div id="t4f3Pop" style="background:linear-gradient(135deg,#E5DAFF,#C5B3FF); border:3px solid #7048E8; border-radius:12px; padding:8px 14px; box-shadow:0 3px 0 #5532B8; text-align:center; font-size:20px; color:#2A2540; opacity:0; transition: opacity 0.4s; white-space:nowrap; overflow:hidden">

      g += `<polygon points="${apexX},${apexY} ${baseR.join(',')} ${baseL.join(',')}" fill="rgba(255,201,64,0.4)" stroke="#E69A1F" stroke-width="5"/>`;

      g += `<line x1="${apexX}" y1="${apexY}" x2="${apexX}" y2="${baseL[1]}" stroke="#7048E8" stroke-width="5" stroke-dasharray="10,6"/>`;
      g += `<rect x="${apexX-16}" y="${baseL[1]-16}" width="16" height="16" fill="none" stroke="#7048E8" stroke-width="3"/>`;
      g += `<text x="${(baseL[0]+baseR[0])/2}" y="${baseL[1]+44}" text-anchor="middle" font-size="36" fill="#FF477E"><tspan font-weight="800">밑변 ${b} cm</tspan></text>`;
      g += `<text x="${apexX+18}" y="${(apexY+baseL[1])/2+10}" font-size="36" fill="#7048E8"><tspan font-weight="800">높이 ${h} cm</tspan></text>`;

defFrames('trap', 'concept', [
  { // F1: 단계별 윗변/아랫변/높이 (양옆 화살표)

      ${hintBar('📐', '사다리꼴의 <b>윗변</b>·<b>아랫변</b>·<b>높이</b>를 한 단계씩 알아봐요.')}

      const BR = [gx+14*cell, gy+8*cell], BL = [gx+2*cell, gy+8*cell];
      const steps = [
        {
          msg: '<div>사다리꼴은 평행한 두 변이</div><div>길이가 달라요.</div>',
          draw: () => {
            let g = gridG(gx, gy, 16, 9, cell);

          }
        },
        {
          msg: '<div>평행한 두 변 중,</div><div>위쪽에 있는 변이 <span style="color:#2FB344"><b>윗변</b></span>, 아래쪽에 있는 변이 <span style="color:#1971C2"><b>아랫변</b></span>이에요.</div>',
          draw: () => {
            let g = gridG(gx, gy, 16, 9, cell);
            g += `<polygon points="${TL.join(',')} ${TR.join(',')} ${BR.join(',')} ${BL.join(',')}" fill="rgba(255,201,64,0.45)" stroke="#E69A1F" stroke-width="5"/>`;
            g += `<line x1="${TL[0]}" y1="${TL[1]}" x2="${TR[0]}" y2="${TR[1]}" stroke="#2FB344" stroke-width="10"/>`;
            g += `<line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="#1971C2" stroke-width="10"/>`;
            g += `<text x="${(TL[0]+TR[0])/2}" y="${TL[1]-18}" text-anchor="middle" font-size="36" fill="#2FB344"><tspan font-weight="800">윗변</tspan></text>`;
            g += `<text x="${(BL[0]+BR[0])/2}" y="${BR[1]+42}" text-anchor="middle" font-size="36" fill="#1971C2"><tspan font-weight="800">아랫변</tspan></text>`;
            return g;
          }
        },
        {
          msg: '<div>두 평행한 변 사이의 수직 거리가</div><div><span style="color:#7048E8"><b>높이</b></span>예요.</div>',
          draw: () => {
            let g = gridG(gx, gy, 16, 9, cell);
            g += `<polygon points="${TL.join(',')} ${TR.join(',')} ${BR.join(',')} ${BL.join(',')}" fill="rgba(255,201,64,0.45)" stroke="#E69A1F" stroke-width="5"/>`;
            g += `<line x1="${TL[0]}" y1="${TL[1]}" x2="${TR[0]}" y2="${TR[1]}" stroke="#2FB344" stroke-width="10"/>`;
            g += `<line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="#1971C2" stroke-width="10"/>`;
            g += `<text x="${(TL[0]+TR[0])/2}" y="${TL[1]-18}" text-anchor="middle" font-size="36" fill="#2FB344"><tspan font-weight="800">윗변</tspan></text>`;
            g += `<text x="${(BL[0]+BR[0])/2}" y="${BR[1]+42}" text-anchor="middle" font-size="36" fill="#1971C2"><tspan font-weight="800">아랫변</tspan></text>`;
            const hx = (TL[0]+TR[0])/2;
            g += `<line x1="${hx}" y1="${TL[1]}" x2="${hx}" y2="${BL[1]}" stroke="#7048E8" stroke-width="8" stroke-dasharray="10,6"/>`;
            g += `<text x="${hx+18}" y="${(TL[1]+BL[1])/2+12}" font-size="36" fill="#7048E8"><tspan font-weight="800">높이</tspan></text>`;
            return g;
          }
        }
      ];
      let s = 0;
      function show() {
        svg.innerHTML = steps[s].draw();
        msg.innerHTML = steps[s].msg;
        document.getElementById('tp5f1Prev').disabled = (s === 0);
        document.getElementById('tp5f1Next').disabled = (s === steps.length - 1);
      }
      document.getElementById('tp5f1Prev').onclick = () => { if (s>0) { s--; show(); } };
      document.getElementById('tp5f1Next').onclick = () => { if (s<steps.length-1) { s++; show(); } };
      show();
    }
  },
  { // F2: 두 사다리꼴 — 마우스로 직접 이동·회전
    html: () => `
      ${hintBar('🤝', '<b>사다리꼴을 180도 돌려서 원래 있던 사다리꼴 옆으로 이동하면 평행사변형이 돼요.</b>')}
      <div class="stage-area" style="position:relative">
        <svg id="tp5f2" viewBox="0 0 760 400" width="760" height="400" preserveAspectRatio="xMidYMid meet" style="max-height:100%"></svg>
        <button id="tp5f2Reset" style="position:absolute; top:10px; right:14px; padding:6px 12px; font-size:14px; background:#FFF6E0; color:#7048E8; border:2px solid #C2B0F0; border-radius:8px; font-family:Jua; cursor:pointer">↺ 처음으로</button>
        <div style="position:absolute; left:14px; bottom:8px; font-size:14px; color:#7048E8; background:rgba(255,255,255,0.85); border:2px solid #C2B0F0; border-radius:8px; padding:4px 10px; font-family:Jua">
          <span style="color:#7048E8">✥</span> 이동 · <span style="color:#E64C82">↻</span> 돌리기
        </div>
      </div>
      <div id="tp5f2Done" class="hidden" style="background:linear-gradient(135deg,#FFE5BA,#FFD08F); border:3px solid #E69A1F; border-radius:14px; padding:12px 20px; text-align:center; font-size:20px; color:#2A2540; box-shadow:0 4px 0 #C99820; margin:0 auto">
        ✨ 평행사변형이 만들어졌어요. 평행사변형의 밑변 = <b style="color:#FF477E">윗변 + 아랫변</b>이고 똑같은 사다리꼴 2개로 만들었으니<br>
        <b style="color:#7048E8">사다리꼴 넓이 = (윗변 + 아랫변) × 높이 ÷ 2</b>
      </div>
    `,
    init: () => {
      const svg = document.getElementById('tp5f2');
      // 사다리꼴 로컬 좌표
      const TL = [220, 80], TR = [300, 80], BR = [380, 260], BL = [140, 260];
      const cx = (TL[0]+TR[0]+BR[0]+BL[0])/4;
      const cy = (TL[1]+TR[1]+BR[1]+BL[1])/4;
      const rMid = [(TR[0]+BR[0])/2, (TR[1]+BR[1])/2];
      // 시작 위치: 오른쪽으로
      const initTx = 360, initTy = 0;
      // 목표: 180° 회전 후 평행이동 → 오른쪽 변(TR-BR)을 공유하는 평행사변형
      const tgtTx = (rMid[0] - cx) * 2;
      const tgtTy = (rMid[1] - cy) * 2;

      function render() {
        let g = '';
        // 점선 목표 자리
        const r = (p) => [2*rMid[0] - p[0], 2*rMid[1] - p[1]];
        const rTL = r(TL), rTR = r(TR), rBR = r(BR), rBL = r(BL);
        g += `<polygon points="${rTL.join(',')} ${rTR.join(',')} ${rBR.join(',')} ${rBL.join(',')}" fill="rgba(255,201,64,0.12)" stroke="#E69A1F" stroke-width="2" stroke-dasharray="6,4"/>`;
        g += `<text x="${(rTL[0]+rTR[0]+rBR[0]+rBL[0])/4}" y="${(rTL[1]+rTR[1]+rBR[1]+rBL[1])/4+6}" text-anchor="middle" font-size="18" fill="#E69A1F">여기로</text>`;
        // 원래 사다리꼴 (고정)
        g += `<polygon points="${TL.join(',')} ${TR.join(',')} ${BR.join(',')} ${BL.join(',')}" fill="rgba(255,201,64,0.55)" stroke="#E69A1F" stroke-width="4"/>`;
        // 움직이는 사다리꼴
        g += `<g id="tp5mov">
          <polygon points="${TL.join(',')} ${TR.join(',')} ${BR.join(',')} ${BL.join(',')}" fill="rgba(255,201,64,0.85)" stroke="#E69A1F" stroke-width="4"/>
          <circle cx="${TL[0]}" cy="${TL[1]}" r="6" fill="#E64C82" stroke="white" stroke-width="2"/>
          <g class="moveHandle">
            <circle cx="${cx}" cy="${cy}" r="22" fill="white" stroke="#7048E8" stroke-width="3"/>
            <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="26" fill="#7048E8" font-weight="800">✥</text>
          </g>
          <g class="rotateHandle">
            <line x1="${cx}" y1="${cy-22}" x2="${cx}" y2="${cy-80}" stroke="#E64C82" stroke-width="2" stroke-dasharray="4,3"/>
            <circle cx="${cx}" cy="${cy-100}" r="22" fill="white" stroke="#E64C82" stroke-width="3"/>
            <text x="${cx}" y="${cy-91}" text-anchor="middle" font-size="26" fill="#E64C82" font-weight="800">↻</text>
          </g>
        </g>`;
        svg.innerHTML = g;
        const movEl = document.getElementById('tp5mov');
        makeMoveRotatable(svg, movEl, {
          cx, cy, tx: initTx, ty: initTy, rot: 0,
          snap: { tx: tgtTx, ty: tgtTy, rot: 180, dDist: 70, dRot: 35 },
          onSnap: () => {
            const handles = movEl.querySelectorAll('.moveHandle, .rotateHandle');
            handles.forEach(h => h.style.display = 'none');
            // 완성 라벨
            const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            lbl.innerHTML = `
              <line x1="${TL[0]}" y1="${TL[1]}" x2="${TR[0]}" y2="${TR[1]}" stroke="#2FB344" stroke-width="6"/>
              <line x1="${BL[0]}" y1="${BL[1]}" x2="${BR[0]}" y2="${BR[1]}" stroke="#1971C2" stroke-width="6"/>
              <line x1="${rTL[0]}" y1="${rTL[1]}" x2="${rTR[0]}" y2="${rTR[1]}" stroke="#2FB344" stroke-width="6"/>
              <text x="${(BL[0]+rTR[0])/2}" y="${BR[1]+34}" text-anchor="middle" font-size="20" fill="#FF477E" font-weight="800">평행사변형의 밑변 = 아랫변 + 윗변</text>
            `;
            svg.appendChild(lbl);
            setTimeout(() => {
              document.getElementById('tp5f2Done').classList.remove('hidden');
              burstConfetti(540, 360);
              addStars(state.studentName, 2);
            }, 200);
          }
        });
      }
      function reset() {
        document.getElementById('tp5f2Done').classList.add('hidden');
        render();
      }
      document.getElementById('tp5f2Reset').onclick = reset;
      render();
    }
  },
  { // F3: 공식 확인 — 도형 위 / 식+공식 아래 (grid 통일 양식)
    html: () => `
      ${hintBar('💡', '<b>윗변</b>·<b>아랫변</b>·<b>높이</b>로 식을 직접 적어 보아요.')}
      <div style="display:grid; grid-template-rows: 1fr auto auto auto; gap:8px; flex:1 1 auto; min-height:0; padding: 4px 8px">
        <div class="stage-area" style="min-height:0; padding: 6px">
          <svg id="tp5f3" viewBox="0 0 760 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="max-height:100%"></svg>
        </div>
        <div style="display:flex; align-items:center; justify-content:center; gap:6px; padding: 4px 12px; flex-wrap:wrap">
          <label style="font-size:20px; color:#5D4037">식</label>
          <span style="font-size:24px">(</span>
          <input class="pr-num tp5f3-inp" id="tp5f3T" type="number" placeholder="윗">
          <span class="pr-op" style="font-size:24px">+</span>
          <input class="pr-num tp5f3-inp" id="tp5f3B" type="number" placeholder="아랫">
          <span style="font-size:24px">)</span>
          <span class="pr-op" style="font-size:24px">×</span>
          <input class="pr-num tp5f3-inp" id="tp5f3H" type="number" placeholder="높이">
          <span class="pr-op" style="font-size:24px">÷&nbsp;2&nbsp;=</span>
          <input class="pr-num tp5f3-inp" id="tp5f3R" type="number" placeholder="넓이">
          <span style="font-size:20px; color:#5D4037">cm²</span>
          <button class="check-btn" id="tp5f3Chk" style="margin-left:4px; font-size:18px; padding:8px 16px">확인</button>
        </div>
        <style>.tp5f3-inp { width:66px !important; height:40px !important; font-size:20px !important; text-align:center; }</style>
        <div id="tp5f3Pop" style="background:linear-gradient(135deg,#E5DAFF,#C5B3FF); border:3px solid #7048E8; border-radius:12px; padding:8px 14px; box-shadow:0 3px 0 #5532B8; text-align:center; font-size:18px; color:#2A2540; opacity:0; transition: opacity 0.4s; white-space:nowrap; overflow:hidden">
          <b>사다리꼴 넓이 = (<span style="color:#2FB344">윗변</span> + <span style="color:#1971C2">아랫변</span>) × <span style="color:#7048E8">높이</span> ÷ 2</b>
          <span id="tp5f3PopExpr" style="color:#7048E8"></span>
        </div>
        <div id="tp5f3Fb" class="feedback" style="text-align:center; margin: 0 auto"></div>
      </div>
    `,
    init: () => {
      const svg = document.getElementById('tp5f3');
      const pop = document.getElementById('tp5f3Pop');
      const fb = document.getElementById('tp5f3Fb');
      const t = 4, b = 8, h = 5;
      const cell = 38, gx = 100, gy = 30;
      let g = gridG(gx, gy, 14, 8, cell);
      const tx1 = gx + 3*cell, ty1 = gy + 1*cell;
      const tx2 = tx1 + t*cell, ty2 = ty1;
      const bx2 = gx + (3 + t + 1)*cell, by2 = ty1 + h*cell;
      const bx1 = gx + 1*cell, by1 = by2;
      // 사다리꼴: top (tx1, ty1) to (tx2, ty1), bottom (bx1, by1) to (bx2, by2)
      g += `<polygon points="${tx1},${ty1} ${tx2},${ty2} ${bx2},${by2} ${bx1},${by1}" fill="rgba(255,201,64,0.4)" stroke="#E69A1F" stroke-width="5"/>`;
      g += `<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#2FB344" stroke-width="8"/>`;
      g += `<line x1="${bx1}" y1="${by1}" x2="${bx2}" y2="${by2}" stroke="#1971C2" stroke-width="8"/>`;
      g += `<text x="${(tx1+tx2)/2}" y="${ty1-18}" text-anchor="middle" font-size="34" fill="#2FB344"><tspan font-weight="800">윗변 ${t} cm</tspan></text>`;
      g += `<text x="${(bx1+bx2)/2}" y="${by1+44}" text-anchor="middle" font-size="34" fill="#1971C2"><tspan font-weight="800">아랫변 ${b} cm</tspan></text>`;
      const hx = (tx1+tx2)/2;
      g += `<line x1="${hx}" y1="${ty1}" x2="${hx}" y2="${by1}" stroke="#7048E8" stroke-width="5" stroke-dasharray="10,6"/>`;
      g += `<text x="${hx+16}" y="${(ty1+by1)/2+10}" font-size="34" fill="#7048E8"><tspan font-weight="800">높이 ${h} cm</tspan></text>`;
      svg.innerHTML = g;
      document.getElementById('tp5f3Chk').onclick = () => {
        const ti = +document.getElementById('tp5f3T').value;
        const bi = +document.getElementById('tp5f3B').value;
        const hi = +document.getElementById('tp5f3H').value;
        const ri = +document.getElementById('tp5f3R').value;
        if (ti === t && bi === b && hi === h && ri === (t+b)*h/2) {
          fb.className = 'feedback';
          fb.textContent = '';
          pop.style.opacity = '1';
          document.getElementById('tp5f3PopExpr').innerHTML = ` = (${t} + ${b}) × ${h} ÷ 2 = <b>${(t+b)*h/2} cm²</b>`;
          burstConfetti(380, 200);
          addStars(state.studentName, 1);
        } else {
          fb.className = 'feedback wrong show';
          fb.textContent = '식과 답을 다시 확인해 봐요.';
        }
      };
    }
  }
]);

            <text x="${right[0]+16}" y="${right[1]+10}" font-size="36" fill="#7048E8"><tspan font-weight="800">대각선</tspan></text>
            <text x="${top[0]+18}" y="${(top[1]+bottom[1])/2+12}" font-size="36" fill="#7048E8"><tspan font-weight="800">대각선</tspan></text>`
        },
        {
          msg: '<div>두 대각선은 <span style="color:#1971C2"><b>서로 수직</b></span>으로 만나요.</div>',
          draw: () => `
            <polygon points="${top.join(',')} ${right.join(',')} ${bottom.join(',')} ${left.join(',')}" fill="rgba(255,107,157,0.4)" stroke="#FF477E" stroke-width="5"/>
            <line x1="${left[0]}" y1="${left[1]}" x2="${right[0]}" y2="${right[1]}" stroke="#7048E8" stroke-width="8"/>
            <line x1="${top[0]}" y1="${top[1]}" x2="${bottom[0]}" y2="${bottom[1]}" stroke="#7048E8" stroke-width="8"/>
            <rect x="${top[0]+4}" y="${right[1]-20}" width="18" height="18" fill="none" stroke="#1971C2" stroke-width="3"/>
            <text x="${top[0]+30}" y="${right[1]-4}" font-size="32" fill="#1971C2"><tspan font-weight="800">수직</tspan></text>`

      ];
      let s = 0;
      function show() {

  },
  { // F3: 마름모 4조각 → 큰 직사각형의 빈 자리에 맞추기 (이동·회전)
    html: () => `
      ${hintBar('🔄', '큰 직사각형 안에 마름모가 있어요. 마름모 4조각을 각각 <b>돌려서</b> 빈 자리에 맞춰 보아요.')}
      <div class="stage-area" style="position:relative">
        <svg id="r6f3" viewBox="0 0 760 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" style="max-height:100%"></svg>
        <button id="r6f3Reset" style="position:absolute; top:10px; right:14px; padding:6px 12px; font-size:14px; background:#FFF6E0; color:#7048E8; border:2px solid #C2B0F0; border-radius:8px; font-family:Jua; cursor:pointer">↺ 처음으로</button>
        <div style="position:absolute; left:14px; bottom:8px; font-size:14px; color:#7048E8; background:rgba(255,255,255,0.85); border:2px solid #C2B0F0; border-radius:8px; padding:4px 10px; font-family:Jua">
          <span style="color:#7048E8">✥</span> 이동 · <span style="color:#E64C82">↻</span> 돌리기
        </div>
      </div>
      <div id="r6f3Done" class="hidden" style="background:linear-gradient(135deg,#FFE5BA,#FFD08F); border:3px solid #E69A1F; border-radius:14px; padding:12px 20px; text-align:center; font-size:18px; color:#2A2540; box-shadow:0 4px 0 #C99820; margin:0 auto">
        ✨ 마름모의 4조각이 큰 직사각형의 빈 자리에 똑같이 들어가요!<br>
        그래서 <b style="color:#7048E8">마름모 넓이 = 큰 직사각형 넓이 ÷ 2 = 한 대각선 × 다른 대각선 ÷ 2</b>
      </div>
    `,
    init: () => {
      const svg = document.getElementById('r6f3');
      const cx = 380, cy = 200;
      const d1 = 320, d2 = 200; // 한 대각선 길이 (큰 직사각형의 가로·세로)
      const rectX = cx - d1/2, rectY = cy - d2/2; // (220, 100)
      const top    = [cx, cy - d2/2];   // (380, 100)
      const right  = [cx + d1/2, cy];   // (540, 200)
      const bottom = [cx, cy + d2/2];   // (380, 300)
      const left   = [cx - d1/2, cy];   // (220, 200)
      const center = [cx, cy];

      // 4 내부 삼각형: pts(로컬), 회전 중심(rcx,rcy)=마름모 변의 중점, 회전 핸들 위치=각 코너 빈 자리 안쪽
      const tris = [
        {
          key: 'TL', pts: [top, center, left],
          rcx: (top[0]+left[0])/2, rcy: (top[1]+left[1])/2,
          rotHx: rectX + 36, rotHy: rectY + 36,
        },
        {
          key: 'TR', pts: [top, right, center],
          rcx: (top[0]+right[0])/2, rcy: (top[1]+right[1])/2,
          rotHx: rectX + d1 - 36, rotHy: rectY + 36,
        },
        {
          key: 'BR', pts: [center, right, bottom],
          rcx: (right[0]+bottom[0])/2, rcy: (right[1]+bottom[1])/2,
          rotHx: rectX + d1 - 36, rotHy: rectY + d2 - 36,
        },
        {
          key: 'BL', pts: [left, center, bottom],
          rcx: (left[0]+bottom[0])/2, rcy: (left[1]+bottom[1])/2,
          rotHx: rectX + 36, rotHy: rectY + d2 - 36,
        },
      ];
      const cornerTris = [
        [[rectX, rectY], top, left],
        [top, [rectX+d1, rectY], right],
        [right, [rectX+d1, rectY+d2], bottom],
        [left, bottom, [rectX, rectY+d2]],
      ];
      function ptsStr(pts) { return pts.map(p => p.join(',')).join(' '); }

      let placedCount = 0;

      function render() {
        let g = '';
        // 큰 직사각형 배경
        g += `<rect x="${rectX}" y="${rectY}" width="${d1}" height="${d2}" fill="rgba(255,201,64,0.08)" stroke="#FFB840" stroke-width="3" stroke-dasharray="10,5"/>`;
        // 대각선
        g += `<line x1="${left[0]}" y1="${left[1]}" x2="${right[0]}" y2="${right[1]}" stroke="#7048E8" stroke-width="2" stroke-dasharray="6,3"/>`;
        g += `<line x1="${top[0]}" y1="${top[1]}" x2="${bottom[0]}" y2="${bottom[1]}" stroke="#7048E8" stroke-width="2" stroke-dasharray="6,3"/>`;
        // 4 코너 빈 자리 (점선 외곽)
        cornerTris.forEach(pts => {
          g += `<polygon points="${ptsStr(pts)}" fill="rgba(255,107,157,0.06)" stroke="#FF477E" stroke-width="2" stroke-dasharray="6,4"/>`;
        });
        // 라벨 (대각선 길이) — 도형 밖
        g += `<text x="${cx}" y="${rectY+d2+34}" text-anchor="middle" font-size="22" fill="#FF477E" font-weight="800">한 대각선 ${d1/40} cm</text>`;
        g += `<text x="${rectX-14}" y="${cy+8}" text-anchor="end" font-size="22" fill="#7048E8" font-weight="800">다른 대각선 ${d2/40} cm</text>`;
        // 4 내부 삼각형 (마우스로 이동·회전)
        tris.forEach(t => {
          const ccx = (t.pts[0][0]+t.pts[1][0]+t.pts[2][0])/3;
          const ccy = (t.pts[0][1]+t.pts[1][1]+t.pts[2][1])/3;
          g += `<g id="r6tri${t.key}">
            <polygon points="${ptsStr(t.pts)}" fill="rgba(255,107,157,0.78)" stroke="#FF477E" stroke-width="3"/>
            <g class="moveHandle">
              <circle cx="${ccx}" cy="${ccy}" r="14" fill="white" stroke="#7048E8" stroke-width="2.5"/>
              <text x="${ccx}" y="${ccy+6}" text-anchor="middle" font-size="18" fill="#7048E8" font-weight="800">✥</text>
            </g>
            <g class="rotateHandle">
              <circle cx="${t.rotHx}" cy="${t.rotHy}" r="14" fill="white" stroke="#E64C82" stroke-width="2.5"/>
              <text x="${t.rotHx}" y="${t.rotHy+6}" text-anchor="middle" font-size="18" fill="#E64C82" font-weight="800">↻</text>
            </g>
          </g>`;
        });
        svg.innerHTML = g;
        // 각 삼각형에 이동·회전 가능
        tris.forEach(t => {
          const el = document.getElementById(`r6tri${t.key}`);
          makeMoveRotatable(svg, el, {
            cx: t.rcx, cy: t.rcy,
            tx: 0, ty: 0, rot: 0,
            snap: { tx: 0, ty: 0, rot: 180, dDist: 90, dRot: 45 },
            onSnap: () => {
              const handles = el.querySelectorAll('.moveHandle, .rotateHandle');
              handles.forEach(h => h.style.display = 'none');
              placedCount++;
              if (placedCount === 4) {
                setTimeout(() => {
                  document.getElementById('r6f3Done').classList.remove('hidden');
                  burstConfetti(380, 360);
                  addStars(state.studentName, 3);
                }, 250);
              }
            }
          });
        });
      }
      function reset() {
        placedCount = 0;
        document.getElementById('r6f3Done').classList.add('hidden');
        render();
      }
      document.getElementById('r6f3Reset').onclick = reset;
      render();
    }
  },

        <div id="r6f4Fb" class="feedback" style="text-align:center; margin: 0 auto"></div>

    `,
    init: () => {
      const svg = document.getElementById('r6f4');
      const pop = document.getElementById('r6f4Pop');
      const fb = document.getElementById('r6f4Fb');
      const d1 = 8, d2 = 6;
      // 도형을 크게 — viewBox 760x420 안에서 scale 키움
      const cx = 380, cy = 210, scale = 38;
      const W = d1*scale, H = d2*scale;
      let g = `<rect x="${cx-W/2}" y="${cy-H/2}" width="${W}" height="${H}" fill="rgba(255,201,64,0.18)" stroke="#FFB840" stroke-width="3" stroke-dasharray="8,5"/>`;
      g += `<polygon points="${cx},${cy-H/2} ${cx+W/2},${cy} ${cx},${cy+H/2} ${cx-W/2},${cy}" fill="rgba(255,107,157,0.45)" stroke="#FF477E" stroke-width="5"/>`;
      g += `<line x1="${cx-W/2}" y1="${cy}" x2="${cx+W/2}" y2="${cy}" stroke="#FF477E" stroke-width="4" stroke-dasharray="8,5"/>`;
      g += `<line x1="${cx}" y1="${cy-H/2}" x2="${cx}" y2="${cy+H/2}" stroke="#7048E8" stroke-width="4" stroke-dasharray="8,5"/>`;

      g += `<text x="${cx+W/2+20}" y="${cy+10}" font-size="36" fill="#7048E8"><tspan font-weight="800">${d2} cm</tspan></text>`;
      svg.innerHTML = g;
      document.getElementById('r6f4Chk').onclick = () => {
        const ai = +document.getElementById('r6f4A').value;
        const bi = +document.getElementById('r6f4B').value;
        const di = +document.getElementById('r6f4D').value;
        const ri = +document.getElementById('r6f4R').value;
        const okAB = (ai === d1 && bi === d2) || (ai === d2 && bi === d1);
        if (okAB && di === 2 && ri === d1*d2/2) {
          fb.className = 'feedback';
          fb.textContent = '';
          pop.style.opacity = '1';
          document.getElementById('r6f4PopExpr').innerHTML = ` = ${d1} × ${d2} ÷ 2 = <b>${d1*d2/2} cm²</b>`;
          burstConfetti(380, 200);
          addStars(state.studentName, 1);
        } else {
          fb.className = 'feedback wrong show';
          fb.textContent = '식과 답을 다시 확인해 봐요.';
        }
      };
    }
  }
]);

          <div style="flex: 0 0 44%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding: 6px">
            <div id="mqText" style="font-size:24px; color:#2A2540; line-height:1.4; word-break:keep-all; overflow-wrap:break-word"></div>
            <div style="display:flex; align-items:center; gap:10px; white-space:nowrap">
              <input id="mqInp" type="number" placeholder="?" style="width:170px; height:64px; text-align:center; font-size:40px; border:3px solid #9775FA; border-radius:12px; outline:none; background:#FFFCF0; color:var(--ink); font-family:'Jua',sans-serif">
              <span id="mqUnit" style="font-size:30px; color:#5D4037">cm²</span>
            </div>
            <button class="check-btn" id="mqChk" style="font-size:18px; padding:8px 20px">제출 ▶</button>
            <div id="mqFb" class="feedback" style="text-align:center; margin: 0 auto; min-height:30px; word-break:keep-all"></div>
          </div>
          <div style="flex: 1 1 auto; display:flex; flex-direction:column; gap:6px; min-width:0">
            <div style="text-align:center; font-size:18px; color:#5D4037">📝 마우스나 손가락으로 풀이를 써 보세요</div>
            <div style="position:relative; flex:1 1 auto; min-height:0">
              <canvas id="mqOcr" width="640" height="540" style="background:#FFFCF0; border:3px solid #FFD08F; border-radius:14px; touch-action:none; cursor:crosshair; display:block; width:100%; height:100%; max-height:100%"></canvas>
              <button class="check-btn" id="mqOcrClear" style="position:absolute; right:14px; top:14px; background:#FFE5BA; color:#5D4037; box-shadow:0 3px 0 #C99820; height:36px; font-size:16px; padding:0 16px">지우기</button>
            </div>
          </div>
        </div>
      </div>
      <!-- 결과 -->
      <div id="mqDone" class="hidden stage-area" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding: 14px; overflow:auto"></div>
    `,
    init: () => {
      const pools = masterPool();
      const poolKeys = Object.keys(pools);
      const typeNames = {
        perimeter: '둘레', rect: '직사각형', para: '평행사변형',
        tri: '삼각형', trap: '사다리꼴', rhom: '마름모'
      };
      let chosen = 0, items = [], i = 0, score = 0, done = false;

      function pickBalanced(n) {
        const sources = {}, counts = {}, remaining = {};
        poolKeys.forEach(k => {
          sources[k] = [...pools[k]].sort(() => Math.random() - 0.5);
          counts[k] = 0;
          remaining[k] = sources[k].length;
        });
        const result = [];
        let safety = 0;
        while (result.length < n && safety < 500) {
          safety++;
          const cand = poolKeys.filter(k => remaining[k] > 0);
          if (cand.length === 0) break;
          cand.sort((a, b) => counts[a] - counts[b] || Math.random() - 0.5);
          const k = cand[0];
          result.push({ ...sources[k][counts[k]], type: k });
          counts[k]++; remaining[k]--;
        }
        return result.sort(() => Math.random() - 0.5);
      }

      let ocrReady = false;
      function setupOcr() {
        if (ocrReady) return;
        const canvas = document.getElementById('mqOcr');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#2A2540'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        let drawing = false;
        function ptFromEvent(e) {
          const r = canvas.getBoundingClientRect();
          const cx = e.touches ? e.touches[0].clientX : e.clientX;
          const cy = e.touches ? e.touches[0].clientY : e.clientY;
          return [(cx - r.left) * canvas.width / r.width, (cy - r.top) * canvas.height / r.height];
        }
        canvas.addEventListener('pointerdown', e => { drawing = true; const [x,y] = ptFromEvent(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); });
        canvas.addEventListener('pointermove', e => { if (!drawing) return; const [x,y] = ptFromEvent(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); });
        canvas.addEventListener('pointerup', () => { drawing = false; });
        canvas.addEventListener('pointerleave', () => { drawing = false; });
        document.getElementById('mqOcrClear').onclick = () => { ctx.clearRect(0,0,canvas.width,canvas.height); };
        const mqInp = document.getElementById('mqInp');
        mqInp.onkeydown = e => { if (e.key === 'Enter') document.getElementById('mqChk').click(); };
        ocrReady = true;
      }
      function resetBoard() {
        const canvas = document.getElementById('mqOcr');
        if (canvas) { const c = canvas.getContext('2d'); c.clearRect(0,0,canvas.width,canvas.height); }
        const mqInp = document.getElementById('mqInp');
        if (mqInp) mqInp.value = '';
      }
      function nbspFix(s) {
        return s.replace(/(\d[\d,]*)\s*(cm²|cm|m²|m|km²|개)/g, '<span style="white-space:nowrap">$1&nbsp;$2</span>');
      }
      function show() {
        if (i >= chosen) return finish();
        document.getElementById('mqI').textContent = i + 1;
        document.getElementById('mqBar').style.width = (i/chosen*100) + '%';
        const it = items[i];
        document.getElementById('mqText').innerHTML = nbspFix(it.q);
        document.getElementById('mqType').textContent = typeNames[it.type] || '-';
        document.getElementById('mqUnit').textContent = it.unit || 'cm²';
        document.getElementById('mqFb').className = 'feedback';
        document.getElementById('mqFb').textContent = '';
        resetBoard();
        document.getElementById('mqInp').focus();
      }
      function finish() {
        if (done) return; done = true;
        document.getElementById('mqBar').style.width = '100%';
        document.getElementById('mqPlay').classList.add('hidden');
        const doneEl = document.getElementById('mqDone');
        doneEl.classList.remove('hidden');
        const perfect = (score === chosen);
        const today = new Date();
        const dateStr = `${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일`;
        if (perfect) {
          doneEl.innerHTML = `
            <div style="background:linear-gradient(135deg,#FFFAE0,#FFE9B3); border:6px double #C99820; border-radius:24px; padding:18px 26px; box-shadow:0 8px 0 #B8860B, 0 16px 40px rgba(184,134,11,0.3); max-width:680px; width:96%; text-align:center; position:relative">
              <div style="position:absolute; top:12px; left:14px; font-size:30px">🏆</div>
              <div style="position:absolute; top:12px; right:14px; font-size:30px">🏆</div>
              <div style="font-size:18px; color:#5D4037; letter-spacing:6px">M A S T E R</div>
              <div style="font-size:36px; color:#B8860B; font-weight:800; margin:4px 0 8px">다각형 넓이 마스터 인증서</div>
              <div style="font-size:17px; color:#5D4037; margin-bottom:10px">위 학생은 다각형의 둘레와 넓이의 모든 공식을<br>완벽하게 익혔음을 인증합니다.</div>
              <div style="background:white; border:3px solid #FFB840; border-radius:14px; padding:10px 22px; margin: 8px auto; display:inline-block">
                <div style="font-size:16px; color:#888">이름</div>
                <div style="font-size:34px; color:#FF477E; font-weight:800">${state.studentName}</div>
              </div>
              <div style="font-size:16px; color:#5D4037; margin-top:6px">${chosen}문제 중 <b style="color:#2FB344">${score}</b>개 모두 정답</div>
              <div style="display:flex; justify-content:center; gap:14px; margin: 10px 0; flex-wrap:wrap; font-size:24px">
                <span title="둘레">🌟</span>
                <span title="직사각형">⬛</span>
                <span title="평행사변형">▱</span>
                <span title="삼각형">🔺</span>
                <span title="사다리꼴">⏢</span>
                <span title="마름모">◆</span>
              </div>
              <div style="font-size:17px; color:#5D4037">${dateStr}</div>
              <div style="margin-top:8px; font-size:16px; color:#7048E8"><b>축하해요!</b> 6가지 도형의 둘레와 넓이를 모두 마스터했어요.</div>
            </div>
            <button class="check-btn" id="mqAgain" style="font-size:18px; padding:10px 24px; margin-top:4px">한 번 더 도전</button>
          `;
          markQuizDone('review');
          const nb = document.getElementById('nextBtn');
          if (nb) nb.disabled = false;
          addStars(state.studentName, 10);
          burstConfetti(500, 200);
          setTimeout(() => burstConfetti(300, 300), 500);
          setTimeout(() => burstConfetti(700, 300), 1000);
        } else {
          doneEl.innerHTML = `
            <div style="font-size:36px; color:#7048E8"><b>🎯 도전 완료</b></div>
            <div style="font-size:26px">${chosen}문제 중 <span style="color:#2FB344; font-size:56px; font-weight:800">${score}</span>개 정답</div>
            <div style="font-size:20px; color:#E64C82; text-align:center">모두 맞혀야 <b>마스터 인증서</b>를 받을 수 있어요.<br>다시 도전해 보아요!</div>
            <button class="check-btn" id="mqAgain" style="font-size:18px; padding:10px 24px">다시 도전</button>
          `;
          addStars(state.studentName, Math.max(1, Math.floor(score/2)));
          burstConfetti(500, 200);
        }
        saveQuizScore(state.studentName, 'review', score, chosen);
        document.getElementById('mqAgain').onclick = () => {
          doneEl.classList.add('hidden');
          document.getElementById('mqSetup').classList.remove('hidden');
          done = false;
        };
      }
      document.querySelectorAll('[data-mqn]').forEach(b => {
        b.onclick = () => {
          chosen = +b.dataset.mqn;
          items = pickBalanced(chosen);
          i = 0; score = 0; done = false;
          document.getElementById('mqT').textContent = chosen;
          document.getElementById('mqI').textContent = 1;
          document.getElementById('mqS').textContent = 0;
          document.getElementById('mqSetup').classList.add('hidden');
          document.getElementById('mqPlay').classList.remove('hidden');
          document.getElementById('mqDone').classList.add('hidden');
          setupOcr();
          show();
        };
      });
      document.getElementById('mqChk').onclick = () => {
        const v = +document.getElementById('mqInp').value;
        const fb = document.getElementById('mqFb');
        if (document.getElementById('mqInp').value === '') {
          fb.className = 'feedback wrong show';
          fb.textContent = '답을 적어 보세요.';
          return;
        }
        if (v === items[i].a) {
          fb.className = 'feedback right show';
          fb.textContent = '✓ 정답.';
          score++;
          document.getElementById('mqS').textContent = score;
          i++;
          setTimeout(show, 600);
        } else {
          fb.className = 'feedback wrong show';
          fb.textContent = '✗ 다시 한 번 풀어 보세요.';
          document.getElementById('mqInp').focus();
          document.getElementById('mqInp').select();
        }
      };
    }
  };
}
